{% extends "base.html" %}

{% block title %}مای‌کلینیک — صفحه اصلی{% endblock %}

{% block content %}
    <section class="py-16 text-center">
        <h1 class="text-4xl font-bold leading-relaxed text-slate-900">
            نوبت پزشک و برنامه دارویی شما،<br>
            <span class="text-teal-700">همه در یک جا</span>
        </h1>
        <p class="mx-auto mt-6 max-w-xl text-lg text-slate-600">
            رزرو حضوری نوبت مطب و پیگیری منظم داروها با یادآوری ایمیلی
        </p>
        <div class="mt-8 flex items-center justify-center gap-4">
            <a href="#" class="rounded-lg bg-teal-600 px-6 py-3 font-semibold text-white hover:bg-teal-700">شروع کنید</a>
            <a href="#" class="rounded-lg border border-slate-300 bg-white px-6 py-3 font-semibold text-slate-700 hover:bg-slate-100">مشاهده پزشکان</a>
        </div>
        <p class="mt-12 text-sm text-slate-400">(صفحه کامل خانه در فاز ۲ پیاده‌سازی می‌شود)</p>
    </section>
{% endblock %}

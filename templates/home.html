{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyClinic — Doctor Appointments & Medication Reminders</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/background.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        @media (min-width: 1024px) {
            html,
            body {
                scrollbar-width: none;
                -ms-overflow-style: none;
                height: 100%;
                overflow-y: hidden;
            }
            html::-webkit-scrollbar {
                width: 0;
                height: 0;
            }
        }

        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        .btn-neon {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(0,0,0,.9);
            box-shadow: 0 15px 25px rgba(0,0,0,.6);
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            overflow: hidden;
            transition: .5s;
            letter-spacing: 2px;
            position: relative;
            height: fit-content;
            white-space: nowrap;
        }

        .btn-neon span {
            position: absolute;
            display: block;
            background: linear-gradient(90deg, transparent, #fff);
            animation: btn-anim1 1.5s linear infinite;
        }

        .btn-neon span:nth-child(1) { top: 0; left: -100%; width: 100%; height: 2px; }
        .btn-neon span:nth-child(2) { top: -100%; right: 0; width: 2px; height: 100%; animation: btn-anim2 1.5s linear infinite; animation-delay: .375s; background: linear-gradient(180deg, transparent, #fff); }
        .btn-neon span:nth-child(3) { bottom: 0; right: -100%; width: 100%; height: 2px; animation: btn-anim3 1.5s linear infinite; animation-delay: .75s; background: linear-gradient(270deg, transparent, #fff); }
        .btn-neon span:nth-child(4) { bottom: -100%; left: 0; width: 2px; height: 100%; animation: btn-anim4 1.5s linear infinite; animation-delay: 1.125s; background: linear-gradient(360deg, transparent, #fff); }

        @keyframes btn-anim1 { 0% { left: -100%; } 50%, 100% { left: 100%; } }
        @keyframes btn-anim2 { 0% { top: -100%; } 50%, 100% { top: 100%; } }
        @keyframes btn-anim3 { 0% { right: -100%; } 50%, 100% { right: 100%; } }
        @keyframes btn-anim4 { 0% { bottom: -100%; } 50%, 100% { bottom: 100%; } }

        .register-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0,0,0,.9);
            box-shadow: 0 15px 25px rgba(0,0,0,.6);
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            overflow: hidden;
            transition: .5s;
            letter-spacing: 2px;
            position: relative;
            white-space: nowrap;
        }

        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-layout {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 88rem;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0 auto;
            padding: clamp(1.5rem, 4vw, 4rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.5rem, 4vw, 3rem);
        }

        .hero-nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.25rem;
            padding: 0 0.5rem;
        }

        .hero-brand {
            color: #0f172a;
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .hero-title {
            max-width: 62rem;
            margin: 0;
            color: #0f172a;
            text-align: center;
            font-size: clamp(2.25rem, 6vw, 5rem);
            line-height: 1.05;
        }

        .hero-actions {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(1rem, 3vw, 2.5rem);
            flex-wrap: wrap;
        }

        .hero-image-wrapper {
            width: min(100%, 28rem);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: auto;
            max-height: 46vh;
            object-fit: contain;
            object-position: bottom;
        }

        .info-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 1rem 2rem rgba(15, 23, 42, .12);
            padding: .75rem 1rem;
        }

        .about-us-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .625rem 1.25rem;
            color: #334155;
            background: rgba(255,255,255,.9);
            border-radius: 999px;
            box-shadow: 0 .75rem 1.5rem rgba(15, 23, 42, .12);
            font-size: .875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all .3s ease;
        }

        .about-us-btn:hover {
            background: #fff;
            box-shadow: 0 1rem 2rem rgba(15, 23, 42, .18);
        }

        @media (max-width: 767px) {
            .hero-section {
                min-height: 100svh;
                padding: 4.5rem 1rem 2rem;
            }

            .hero-layout {
                min-height: 100svh;
                padding: 0;
                gap: 1.5rem;
                justify-content: flex-start;
            }

            .hero-nav {
                width: 100%;
            }

            .hero-title {
                width: 100%;
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .hero-actions {
                flex-direction: column;
                gap: 1rem;
            }

            .hero-actions .btn-neon {
                width: 100%;
                max-width: 22rem;
                text-align: center;
            }

            .hero-actions .btn-neon:first-child { order: 1; }
            .hero-actions .btn-neon:last-child { order: 2; }
            .hero-image-wrapper { order: 3; width: min(100%, 20rem); }

            .info-card {
                padding: .625rem .75rem;
            }

            .about-us-btn {
                padding: .5rem 1rem;
                font-size: .75rem;
            }
        }

        @media (min-width: 768px) {
            .hero-nav {
                position: absolute;
                top: 30px;
                left: 0;
                right: 0;
                padding: 0 clamp(1rem, 3vw, 2rem);
            }

            .hero-layout {
                max-width: 96rem;
                padding: clamp(2rem, 3vw, 5rem);
            }

            .hero-section {
                min-height: 110vh;
            }

            .hero-actions {
                flex-wrap: nowrap;
            }

            .hero-image-wrapper {
                width: clamp(26rem, 40vw, 40rem);
                max-width: 45rem;
            }
        }

        @media (min-width: 1024px) {
            .hero-section {
                min-height: 100vh;
                min-height: 100svh;
            }

            .hero-layout {
                width: 95vw;
                min-height: 100vh;
                min-height: 100svh;
            }

            .hero-title {
                margin-bottom: 7rem;
            }

            .hero-image-wrapper {
                width: clamp(34rem, 46vw, 54rem);
                max-width: 54rem;
            }

            .hero-image-wrapper img {
                max-height: 62vh;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
<div class="container"></div>

<section class="hero-section">
    <!-- Decorative Blobs -->
    <div class="absolute top-20 left-10 w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob blob"></div>
    <div class="absolute top-40 right-10 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-2000 blob"></div>
    <div class="absolute bottom-20 left-1/2 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-4000 blob"></div>

    <div class="hero-layout">
        <!-- 1. Brand and registration -->
        <header class="hero-nav">
            <a href="/" class="hero-brand">MyClinic</a>
            <a href="{% url 'accounts:patient_signup' %}" class="register-btn">
                <span></span><span></span><span></span><span></span>
                Register
            </a>
        </header>

        <!-- 2. Main heading -->
        <h1 class="hero-title">
            Give yourself the gift of good health with us
        </h1>

        <!-- 3. Book appointment, hero image, and medication -->
        <div class="hero-actions">
            <a href="{% url 'core:appointment_info' %}" class="btn-neon">
                <span></span><span></span><span></span><span></span>
                Book Appointment
            </a>

            <div class="hero-image-wrapper">
                <!-- Main Image -->
                <img src="{% static 'images/hero_image.png' %}"
                     alt="Healthcare Professional"
                     class="relative z-10 w-full h-auto object-contain object-bottom drop-shadow-2xl">
            </div>

            <a href="{% url 'core:medication_info' %}" class="btn-neon">
                <span></span><span></span><span></span><span></span>
                Set Medication
            </a>
        </div>

        </div>
</section>

{% block content %}{% endblock %}

<script src="{% static 'js/flatpickr.min.js' %}"></script>
<script src="{% static 'js/flatpickr-init.js' %}"></script>
<script>
    (function () {
        var carousels = document.querySelectorAll("[data-doctor-carousel]");
        carousels.forEach(function (carousel) {
            var viewport = carousel.querySelector("[data-carousel-viewport]");
            var prevBtn = carousel.querySelector("[data-carousel-prev]");
            var nextBtn = carousel.querySelector("[data-carousel-next]");
            var items = carousel.querySelectorAll("[data-carousel-item]");
            if (!viewport || !prevBtn || !nextBtn || items.length === 0) return;

            var rtl = (document.documentElement.getAttribute("dir") || "ltr").toLowerCase() === "rtl";
            var reduceMotion = window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            function scrollByCards(direction) {
                var item = items[0];
                if (!item) return;
                var cardWidth = item.getBoundingClientRect().width;
                var gap = parseFloat(getComputedStyle(item.parentNode).gap) || 0;
                var scrollAmount = cardWidth + gap;
                var behavior = reduceMotion ? "auto" : "smooth";
                viewport.scrollBy({
                    left: direction * scrollAmount,
                    behavior: behavior,
                });
            }

            prevBtn.addEventListener("click", function () {
                scrollByCards(rtl ? 1 : -1);
            });
            nextBtn.addEventListener("click", function () {
                scrollByCards(rtl ? -1 : 1);
            });

            var controls = carousel.querySelector("[data-carousel-controls]");

            function updateButtons() {
                var scrollLeft = viewport.scrollLeft;
                var maxScroll = viewport.scrollWidth - viewport.clientWidth;
                if (maxScroll <= 1) {
                    if (controls) controls.style.display = "none";
                    return;
                }
                if (controls) controls.style.display = "";
                var atStart = scrollLeft <= 1;
                var atEnd = scrollLeft >= maxScroll - 1;
                prevBtn.disabled = atStart;
                nextBtn.disabled = atEnd;
            }

            viewport.addEventListener("scroll", updateButtons, { passive: true });
            window.addEventListener("resize", updateButtons);
            updateButtons();
        });
    })();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyClinic — Doctor Appointments & Medication Reminders</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/background.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <div class="background"></div>

    <!-- Floating Brand and Register -->
    <div class="fixed top-0 left-0 right-0 w-full px-8 py-6 flex justify-between items-center" style="z-index: 9999;">
        <a href="/" class="auth-brand" style="position: fixed; left: 20px; transform: none; color: #000;">MyClinic</a>
        <a href="{% url 'accounts:patient_signup' %}" style="position: fixed; right: 20px; top: 20px; display: inline-block; padding: 10px 20px; background: rgba(0,0,0,.9); box-shadow: 0 15px 25px rgba(0,0,0,.6); border-radius: 10px; font-weight: bold; color: #fff; font-size: 14px; text-decoration: none; text-transform: uppercase; overflow: hidden; transition: .5s; letter-spacing: 2px;">
            <span style="position: absolute; display: block; top: 0; left: -100%; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #fff); animation: btn-anim1 1.5s linear infinite;"></span>
            <span style="position: absolute; display: block; top: -100%; right: 0; width: 2px; height: 100%; background: linear-gradient(180deg, transparent, #fff); animation: btn-anim2 1.5s linear infinite; animation-delay: .375s;"></span>
            <span style="position: absolute; display: block; bottom: 0; right: -100%; width: 100%; height: 2px; background: linear-gradient(270deg, transparent, #fff); animation: btn-anim3 1.5s linear infinite; animation-delay: .75s;"></span>
            <span style="position: absolute; display: block; bottom: -100%; left: 0; width: 2px; height: 100%; background: linear-gradient(360deg, transparent, #fff); animation: btn-anim4 1.5s linear infinite; animation-delay: 1.125s;"></span>
            Register
        </a>
    </div>

    <section class="relative flex w-full items-end justify-center overflow-hidden" style="height: 100vh;">
        <!-- Decorative Elements -->
        <div class="absolute top-20 left-10 w-72 h-72 bg-blue-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob"></div>
        <div class="absolute top-40 right-10 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-20 left-1/2 w-72 h-72 bg-pink-400 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-blob animation-delay-4000"></div>

        <div class="relative z-10 w-full h-full flex items-end justify-center px-4 sm:px-6 lg:px-8 pb-0">
            <div class="max-w-7xl mx-auto w-full">
                <div class="grid lg:grid-cols-2 gap-12 items-end">
                    <!-- Left Column: Content -->
                    <div class="text-center space-y-8 pb-12 flex flex-col items-center">
                        <!-- Main Headline -->
                        <h1 class="font-extrabold text-slate-900 leading-tight" style="font-size: clamp(1.75rem, 5vw, 4.5rem); width: 80vw;">
                            Give yourself the gift of good health with us
                        </h1>
                    </div>

                    <!-- Right Column: Hero Image -->
                    <div class="relative flex items-center justify-center lg:justify-end gap-4">
                        <!-- Book Appointment Button -->
                        <a href="{% url 'core:doctor_list' %}" style="display: inline-block; padding: 12px 24px; background: rgba(0,0,0,.9); box-shadow: 0 15px 25px rgba(0,0,0,.6); border-radius: 10px; font-weight: bold; color: #fff; font-size: 14px; text-decoration: none; text-transform: uppercase; overflow: hidden; transition: .5s; letter-spacing: 2px; position: relative; height: fit-content;">
                            <span style="position: absolute; display: block; top: 0; left: -100%; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #fff); animation: btn-anim1 1.5s linear infinite;"></span>
                            <span style="position: absolute; display: block; top: -100%; right: 0; width: 2px; height: 100%; background: linear-gradient(180deg, transparent, #fff); animation: btn-anim2 1.5s linear infinite; animation-delay: .375s;"></span>
                            <span style="position: absolute; display: block; bottom: 0; right: -100%; width: 100%; height: 2px; background: linear-gradient(270deg, transparent, #fff); animation: btn-anim3 1.5s linear infinite; animation-delay: .75s;"></span>
                            <span style="position: absolute; display: block; bottom: -100%; left: 0; width: 2px; height: 100%; background: linear-gradient(360deg, transparent, #fff); animation: btn-anim4 1.5s linear infinite; animation-delay: 1.125s;"></span>
                            Book Appointment
                        </a>

                        <div class="relative">
                            <!-- Floating Card 1 -->
                            <div class="absolute -top-4 -left-4 bg-white rounded-2xl shadow-xl p-4 animate-float hidden sm:block" style="animation-delay: 0s;">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center">
                                        <svg class="w-5 h-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-xs font-semibold text-slate-900">Appointment Booked</p>
                                        <p class="text-xs text-slate-500">Dr. Smith - Today 3PM</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Floating Card 2 -->
                            <div class="absolute bottom-8 -right-4 bg-white rounded-2xl shadow-xl p-4 animate-float hidden sm:block" style="animation-delay: 1s;">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                                        <svg class="w-5 h-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                    </div>
                                    <div>
                                        <p class="text-xs font-semibold text-slate-900">Medication Reminder</p>
                                        <p class="text-xs text-slate-500">Take aspirin - 8:00 AM</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Main Image -->
                            <img src="{% static 'images/hero-doctor.png' %}"
                                 alt="Healthcare Professional"
                                 class="relative z-10 w-full max-w-md h-auto object-contain object-bottom drop-shadow-2xl">
                        </div>

                        <!-- Set Medication Button -->
                        <a href="{% url 'medications:medication_list' %}" style="display: inline-block; padding: 12px 24px; background: rgba(0,0,0,.9); box-shadow: 0 15px 25px rgba(0,0,0,.6); border-radius: 10px; font-weight: bold; color: #fff; font-size: 14px; text-decoration: none; text-transform: uppercase; overflow: hidden; transition: .5s; letter-spacing: 2px; position: relative; height: fit-content;">
                            <span style="position: absolute; display: block; top: 0; left: -100%; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #fff); animation: btn-anim1 1.5s linear infinite;"></span>
                            <span style="position: absolute; display: block; top: -100%; right: 0; width: 2px; height: 100%; background: linear-gradient(180deg, transparent, #fff); animation: btn-anim2 1.5s linear infinite; animation-delay: .375s;"></span>
                            <span style="position: absolute; display: block; bottom: 0; right: -100%; width: 100%; height: 2px; background: linear-gradient(270deg, transparent, #fff); animation: btn-anim3 1.5s linear infinite; animation-delay: .75s;"></span>
                            <span style="position: absolute; display: block; bottom: -100%; left: 0; width: 2px; height: 100%; background: linear-gradient(360deg, transparent, #fff); animation: btn-anim4 1.5s linear infinite; animation-delay: 1.125s;"></span>
                            Set Medication
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Scroll Indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce hidden lg:block">
            <svg class="w-6 h-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
        </div>
    </section>

    <style>
        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Medications — MyClinic</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/background.css' %}">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
<div class="container"></div>

{% include "_header.html" %}

<main class="mx-auto max-w-6xl px-4 pb-16">
    <section class="flex flex-col-reverse items-center gap-8 md:flex-row-reverse md:items-center md:justify-between">
        <img src="{% static 'images/medication1.png' %}"
             alt="Medication schedule"
             class="w-full max-w-xl rounded-2xl object-cover shadow-xl md:w-1/2">

        <h1 class="max-w-xl text-center text-3xl font-extrabold leading-tight text-slate-900 sm:text-4xl md:text-left lg:text-5xl">
            Has managing your medication schedule become complicated? Leave it to us
        </h1>
    </section>

    <section class="mt-16 flex flex-col-reverse items-center gap-8 md:flex-row md:items-center md:justify-between">
        <img src="{% static 'images/medication2.png' %}"
             alt="Remind medication"
             class="w-full max-w-xl rounded-2xl object-cover shadow-xl md:w-1/2">

        <div>
            <h1 class="max-w-xl text-center text-3xl font-extrabold leading-tight text-slate-900 sm:text-4xl md:text-left lg:text-5xl">
                Just add medication and we will remind it
            </h1>
            <div class="mt-6 flex justify-center md:justify-center">
                <a href="{% url 'medications:medication_list' %}"
                   class="inline-block rounded-lg bg-black px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-slate-700 md:px-8 md:py-4 md:text-base">
                    Set Medication Schedule
                </a>
            </div>
        </div>
    </section>
</main>

{% include "_footer.html" %}

</body>
</html>

{% load static %}

<a href="{% url 'core:doctor_detail' doctor.pk %}"
   class="group relative flex h-full w-full flex-col rounded-xl bg-white bg-clip-border text-gray-700 shadow-md transition-all hover:-translate-y-0.5 hover:shadow-lg">
    <div class="relative mx-4 -mt-6 h-40 overflow-hidden rounded-xl bg-gradient-to-r from-gray-900 to-black text-white shadow-lg shadow-black/40">
        {% if doctor.profile_picture %}
            <img src="{{ doctor.profile_picture.url }}"
                 alt="Dr. {{ doctor.user.get_full_name }}"
                 class="h-full w-full object-cover">
        {% else %}
            <div class="flex h-full w-full items-center justify-center text-6xl font-bold text-white/90">
                {{ doctor.user.first_name|slice:":1"|default:"D" }}
            </div>
        {% endif %}
    </div>
    <div class="p-6">
        <p class="mb-1 text-sm font-semibold text-gray-800">{{ doctor.specialty }}</p>
        <h5 class="mb-2 block font-sans text-xl font-semibold leading-snug tracking-normal text-blue-gray-900 antialiased">
            Dr. {{ doctor.user.get_full_name }}
        </h5>
        <p class="line-clamp-2 block font-sans text-base font-light leading-relaxed text-inherit antialiased">
            {{ doctor.description }}
        </p>
    </div>
    <div class="mt-auto p-6 pt-0">
        <span class="select-none rounded-lg bg-black px-6 py-3 text-center align-middle font-sans text-xs font-bold uppercase text-white shadow-md shadow-black/20 transition-all hover:shadow-lg hover:shadow-black/40">
            Book Appointment
        </span>
    </div>
</a>

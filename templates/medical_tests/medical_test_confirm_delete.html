{% extends "base.html" %}

{% block title %}حذف نتیجه آزمایش — مای‌کلینیک{% endblock %}

{% block content %}
    <div class="mx-auto max-w-2xl">
        <h1 class="mb-6 text-2xl font-bold text-slate-900">حذف نتیجه آزمایش</h1>

        <div class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-8">
            <p class="mb-4 text-slate-700">آیا مطمئن هستید که می‌خواهید فایل آزمایش <strong>{{ object.category }}</strong> را حذف کنید؟</p>
            <p class="mb-6 text-sm text-red-600">این عمل قابل بازگشت نیست.</p>
            <form method="post">
                {% csrf_token %}
                <div class="flex gap-3">
                    <button type="submit" class="rounded-lg bg-red-600 px-5 py-2.5 text-white hover:bg-red-700">
                        حذف
                    </button>
                    <a href="{% url 'medical_tests:medical_test_list' %}" class="rounded-lg border border-slate-300 px-5 py-2.5 text-slate-700 hover:bg-slate-50">
                        انصراف
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

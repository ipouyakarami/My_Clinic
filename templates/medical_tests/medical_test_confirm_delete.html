{% extends "base.html" %}

{% block title %}Delete Test Result — MyClinic{% endblock %}

{% block content %}
    <div class="mx-auto max-w-2xl">
        <h1 class="mb-6 text-2xl font-bold text-slate-900">Delete Test Result</h1>

        <div class="service-box">
            <p class="mb-4 text-slate-300">Are you sure you want to delete the test file <strong class="text-white">{{ object.name|default:object.get_category_display }}</strong>?</p>
            <p class="mb-6 text-sm text-red-400">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="flex gap-3">
                    <button type="submit" class="rounded-lg bg-red-600 px-3 py-1.5 text-sm text-white hover:bg-red-700 md:px-5 md:py-2.5 md:text-base">Delete</button>
                    <a href="{% url 'medical_tests:medical_test_list' %}" class="auth-btn"><span></span><span></span><span></span><span></span>Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

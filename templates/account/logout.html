{% extends "base.html" %}

{% block title %}Log Out — MyClinic{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <h1 class="mb-4 text-2xl font-bold text-slate-900">Log Out</h1>
        <p class="mb-6 text-sm text-slate-600">Are you sure you want to log out?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="rounded-lg bg-primary px-6 py-2.5 font-semibold text-white hover:bg-primary/90">
                Yes, Log Out
            </button>
            <a href="/" class="ms-3 inline-block rounded-lg border border-slate-300 px-6 py-2.5 font-semibold text-slate-700 hover:bg-slate-100">
                Cancel
            </a>
        </form>
    </div>
{% endblock %}

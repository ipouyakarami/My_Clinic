<!DOCTYPE html>
<html lang="en" dir="ltr">
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; direction: ltr; text-align: left; background: #f8fafc; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px;">
        <h2 style="color: #0f766e; margin: 0 0 16px;">MyClinic</h2>
        <p>Hello{% if user.first_name %} {{ user.first_name }}{% endif %},</p>
        <p>To set a new password, click the button below:</p>
        <p style="text-align: center; margin: 28px 0;">
            <a href="{{ password_reset_url }}"
               style="background: #0d9488; color: #ffffff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: bold;">
                Set New Password
            </a>
        </p>
        <p style="color: #64748b; font-size: 13px;">
            If you did not make this request, please ignore this email and your current password will not be changed.
        </p>
    </div>
</body>
</html>

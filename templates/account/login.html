{% extends "base.html" %}

{% block title %}ورود — مای‌کلینیک{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="mb-6 text-2xl font-bold text-slate-900">ورود به حساب</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "accounts/_form.html" with form=form submit_label="ورود" %}
        </form>
        <div class="mt-6 space-y-2 text-center text-sm text-slate-600">
            <p>
                رمز عبور را فراموش کرده‌اید؟
                <a href="{% url 'account_reset_password' %}" class="font-medium text-teal-700 hover:underline">بازیابی رمز عبور</a>
            </p>
            <p>
                حساب ندارید؟
                <a href="{% url 'accounts:patient_signup' %}" class="font-medium text-teal-700 hover:underline">ثبت‌نام بیمار</a>
            </p>
        </div>
    </div>
{% endblock %}

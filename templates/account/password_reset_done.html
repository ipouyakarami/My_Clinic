{% extends "base.html" %}

{% block title %}Recover Password — MyClinic{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-emerald-200 bg-emerald-50 p-8 text-center">
        <h1 class="mb-3 text-xl font-bold text-emerald-900">Email Sent</h1>
        <p class="text-sm leading-relaxed text-emerald-800">
            If this email is registered in our system, a password recovery link has been sent to you.
            Please also check your spam folder.
        </p>
        <a href="{% url 'account_login' %}" class="mt-6 inline-block rounded-lg bg-primary px-6 py-2.5 font-semibold text-white hover:bg-primary/90">
            Back to Log In
        </a>
    </div>
{% endblock %}

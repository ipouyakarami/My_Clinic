{% extends "base.html" %}

{% block title %}بازیابی رمز عبور — مای‌کلینیک{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-emerald-200 bg-emerald-50 p-8 text-center">
        <h1 class="mb-3 text-xl font-bold text-emerald-900">ایمیل ارسال شد</h1>
        <p class="text-sm leading-relaxed text-emerald-800">
            اگر این ایمیل در سیستم ثبت شده باشد، لینک بازیابی رمز عبور برایتان ارسال شد.
            پوشه هرزنامه (Spam) را نیز بررسی کنید.
        </p>
        <a href="{% url 'account_login' %}" class="mt-6 inline-block rounded-lg bg-teal-600 px-6 py-2.5 font-semibold text-white hover:bg-teal-700">
            بازگشت به صفحه ورود
        </a>
    </div>
{% endblock %}

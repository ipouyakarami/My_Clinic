{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}مای‌کلینیک{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

    <header class="border-b border-slate-200 bg-white">
        <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
            <a href="/" class="text-xl font-bold text-teal-700">مای‌کلینیک</a>
            <ul class="flex items-center gap-6 text-sm font-medium">
                <li><a href="/" class="text-slate-600 hover:text-teal-700">خانه</a></li>
                <li><a href="#" class="text-slate-600 hover:text-teal-700">پزشکان</a></li>
                <li><a href="#" class="rounded-lg bg-teal-600 px-4 py-2 text-white hover:bg-teal-700">ورود</a></li>
            </ul>
        </nav>
    </header>

    {% if messages %}
        <div class="mx-auto max-w-6xl px-4 pt-4">
            {% for message in messages %}
                <div class="mb-2 rounded-lg border px-4 py-3 text-sm
                            {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}
                            {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% endif %}
                            {% if message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800{% endif %}
                            {% if message.tags == 'info' or message.tags == '' %}border-sky-200 bg-sky-50 text-sky-800{% endif %}">
                {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="mx-auto max-w-6xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto border-t border-slate-200 bg-white">
        <div class="mx-auto max-w-6xl px-4 py-6 text-center text-sm text-slate-500">
            مای‌کلینیک — رزرو نوبت مطب و پیگیری دارو
        </div>
    </footer>

</body>
</html>

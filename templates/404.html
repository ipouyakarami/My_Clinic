{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found — MyClinic</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/background.css' %}">
    <style>
        .my-custom-face-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
            background: #ffffff00;
            color: #1a1a1a;
        }

        .my-custom-face-container .face {
            width: 200px;
        }

        .my-custom-face-container .face__eyes,
        .my-custom-face-container .face__eye-lid,
        .my-custom-face-container .face__mouth-left,
        .my-custom-face-container .face__mouth-right,
        .my-custom-face-container .face__nose,
        .my-custom-face-container .face__pupil {
            animation: eyes 1s 0.3s forwards;
        }

        .my-custom-face-container .face__eye-lid,
        .my-custom-face-container .face__pupil {
            animation-duration: 4s;
            animation-delay: 1.3s;
            animation-iteration-count: infinite;
        }

        .my-custom-face-container .face__eye-lid {
            animation-name: eye-lid;
        }
        .my-custom-face-container .face__mouth-left {
            animation-name: mouth-left;
        }
        .my-custom-face-container .face__mouth-right {
            animation-name: mouth-right;
        }
        .my-custom-face-container .face__nose {
            animation-name: nose;
        }
        .my-custom-face-container .face__pupil {
            animation-name: pupil;
        }

        @keyframes eye-lid {
            0%,
            40%,
            45%,
            100% {
                transform: translateY(0);
            }
            42.5% {
                transform: translateY(17.5px);
            }
        }

        @keyframes eyes {
            from {
                transform: translateY(112.5px);
            }
            to {
                transform: translateY(15px);
            }
        }

        @keyframes pupil {
            0%,
            37.5%,
            40%,
            45%,
            87.5%,
            100% {
                stroke-dashoffset: 0;
                transform: translate(0, 0);
            }
            12.5%,
            25%,
            62.5%,
            75% {
                transform: translate(-35px, 0);
            }
            42.5% {
                stroke-dashoffset: 35;
                transform: translate(0, 17.5px);
            }
        }

        @keyframes mouth-left {
            from,
            50% {
                stroke-dashoffset: -102;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes mouth-right {
            from,
            50% {
                stroke-dashoffset: 102;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes nose {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(0, 22.5px);
            }
        }

        .not-found-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .not-found-title {
            margin: -1.5rem 0 0.5rem;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.1em;
        }

        .not-found-text {
            margin: 0 0 2rem;
            font-size: 1.1rem;
            color: #475569;
        }

        .btn-neon {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            transition: 0.5s;
        }

        .btn-neon:hover {
            background: #fff;
            color: #272727;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
<div class="container"></div>

<main class="not-found-wrap">
    <div class="my-custom-face-container">
        <svg class="face" viewBox="0 0 320 380">
            <g
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="25"
            >
                <g class="face__eyes" transform="translate(0,112.5)">
                    <g transform="translate(15,0)">
                        <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
                        <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35"></polyline>
                    </g>
                    <g transform="translate(230,0)">
                        <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
                        <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35"></polyline>
                    </g>
                </g>
                <rect class="face__nose" x="132.5" y="112.5" width="55" height="155" rx="4" ry="4"></rect>
                <g transform="translate(65,334)" stroke-dasharray="102 102">
                    <path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0"></path>
                    <path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30"></path>
                </g>
            </g>
        </svg>
    </div>
    <h1 class="not-found-title">404</h1>
    <p class="not-found-text">Oops! The page you are looking for does not exist.</p>
    <a href="/" class="btn-neon">Back to Home</a>
</main>

</body>
</html>

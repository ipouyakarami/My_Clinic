{% extends "base.html" %}

{% block title %}Activate Account — MyClinic{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="mb-2 text-2xl font-bold text-slate-900">Set Password</h1>
        <p class="mb-6 text-sm text-slate-500">
            To activate your account, choose a new password.
        </p>
        <form method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="key" value="{{ key }}">
            {% include "accounts/_form.html" with form=form submit_label="Activate Account" %}
        </form>
    </div>
{% endblock %}

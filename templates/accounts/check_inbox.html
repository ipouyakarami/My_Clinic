{% extends "base.html" %}

{% block title %}بررسی ایمیل — مای‌کلینیک{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md rounded-2xl border border-emerald-200 bg-emerald-50 p-8 text-center">
        <h1 class="mb-3 text-2xl font-bold text-emerald-900">ایمیل خود را بررسی کنید</h1>
        <p class="text-sm leading-relaxed text-emerald-800">
            لینک فعال‌سازی و تعیین رمز عبور به ایمیل شما ارسال شد.
            اگر ایمیل را دریافت نکرده‌اید، پوشه هرزنامه (Spam) را نیز بررسی کنید.
        </p>
        <a href="/" class="mt-6 inline-block rounded-lg bg-teal-600 px-6 py-2.5 font-semibold text-white hover:bg-teal-700">
            بازگشت به صفحه اصلی
        </a>
    </div>
{% endblock %}

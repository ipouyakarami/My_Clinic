<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تایید رزرو نوبت</title>
    <style>
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; text-align: right; color: #1f2937; background-color: #f8fafc; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 32px; border: 1px solid #e2e8f0; }
        .header { font-size: 20px; font-weight: 700; color: #0f766e; margin-bottom: 16px; }
        .info { background: #f0fdfa; border-radius: 12px; padding: 16px; margin: 16px 0; }
        .label { font-size: 13px; color: #64748b; }
        .value { font-size: 15px; font-weight: 600; color: #0f172a; margin-top: 4px; }
        .cta { display: inline-block; margin-top: 24px; padding: 10px 20px; background: #0d9488; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; }
        .footer { margin-top: 32px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">تایید رزرو نوبت</div>
        <p>نوبت شما با موفقیت رزرو شد.</p>
        <div class="info">
            <div class="label">پزشک</div>
            <div class="value">دکتر {{ slot.doctor.user.get_full_name }}</div>
            <div class="label" style="margin-top:12px">تاریخ</div>
            <div class="value">{{ slot.date|date:"Y/m/d" }}</div>
            <div class="label" style="margin-top:12px">ساعت</div>
            <div class="value">{{ slot.start_time|time:"H:i" }} تا {{ slot.end_time|time:"H:i" }}</div>
            <div class="label" style="margin-top:12px">تخصص</div>
            <div class="value">{{ slot.doctor.specialty }}</div>
        </div>
        <a class="cta" href="http://{{ request.get_host }}{% url 'appointments:patient_appointment_list' %}">مشاهده نوبت‌های من</a>
        <div class="footer">مای‌کلینیک — رزرو نوبت مطب و پیگیری دارو</div>
    </div>
</body>
</html>
